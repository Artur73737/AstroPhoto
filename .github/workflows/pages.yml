name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/site-captures/**'
      - 'assets/astrophoto.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/site-captures/**'
      - 'assets/astrophoto.svg'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, released, prereleased, deleted]
  repository_dispatch:
    types: [release-assets-updated]
  schedule:
    # Also reconcile asset additions/removals, which have no release webhook.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # Release events can target an older commit; always build the current site.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prepare real application screenshots
        run: npm run prepare:assets
      - name: Test release synchronization
        run: npm test
      - name: Build static site with GitHub release links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        # prebuild requests release JSON metadata only; installer files stay on GitHub.
        run: npm run build
      - name: Check the GitHub Pages export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run check:export
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
